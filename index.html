    function switchModalTab(tabName, studentId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      document.getElementById(`tab-btn-${tabName}`)?.classList.add('active');
      document.getElementById(`tab-content-${tabName}`)?.classList.add('active');

      const footer = document.getElementById('modal-save-footer');
      if (footer) {
        footer.style.display = (tabName === 'report' || tabName === 'pastgoals' || tabName === 'data') ? 'none' : 'flex';
      }

      if (tabName === 'data' && studentId) {
        switchDataGoalTab(1, studentId);
      }
      if (tabName === 'report' && studentId) {
        renderProgressReportContent(studentId);
      }
      if (tabName === 'pastgoals' && studentId) {
        renderPastIepGoals(studentId);
      }
    }

    function setChartView(viewType, studentId, objKey) {
      activeChartViews[objKey] = viewType;
      setPreferredChartView(viewType);

      const lineBtn = document.getElementById(`chartview-line-btn-${objKey}`);
      const pieBtn = document.getElementById(`chartview-pie-btn-${objKey}`);

      if (viewType === 'line') {
        lineBtn?.classList.add('selected');
        pieBtn?.classList.remove('selected');
      } else {
        pieBtn?.classList.add('selected');
        lineBtn?.classList.remove('selected');
      }

      renderObjectiveChart(studentId, objKey);
    }

    async function renderObjectiveChart(studentId, objKey) {
      const student = allStudents.find(s => s.id === studentId);
      const canvas = document.getElementById(`progress-chart-canvas-${objKey}`);
      if (!canvas) return;

      const { data, error } = await supabaseClient
        .from('progress_data')
        .select('*')
        .eq('student_id', studentId)
        .eq('objective_key', objKey)
        .eq('iep_version', student?.iep_version || 1)
        .order('created_at', { ascending: true });

      if (activeChartInstances[objKey]) {
        activeChartInstances[objKey].destroy();
        activeChartInstances[objKey] = null;
      }

      const exclusionEl = document.getElementById(`chart-exclusion-counters-${objKey}`);
      if (exclusionEl) exclusionEl.innerHTML = '';

      renderDataTabObjectiveSummary(student, objKey, data || []);

      if (error || !data || data.length === 0) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '14px system-ui';
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'center';
        ctx.fillText('No data logged for this objective yet.', canvas.width / 2, 100);
        return;
      }

      const noOppCount = data.filter(d => d.status === 'No Opportunity').length;
      const absentCount = data.filter(d => d.status === 'Absent').length;

      if (exclusionEl) {
        let exclusionHTML = '';
        if (noOppCount > 0) {
          exclusionHTML += `<span style="font-size:11px; font-weight:600; background:#f1f5f9; color:var(--text-muted); border:1px solid var(--border-card); border-radius:12px; padding:2px 8px;">No Opp: ${noOppCount}</span>`;
        }
        if (absentCount > 0) {
          exclusionHTML += `<span style="font-size:11px; font-weight:600; background:#fee2e2; color:var(--danger); border:1px solid #fca5a5; border-radius:12px; padding:2px 8px;">Absent: ${absentCount}</span>`;
        }
        exclusionEl.innerHTML = exclusionHTML;
      }

      const format = getObjectiveFormat(student, objKey);
      const activeView = activeChartViews[objKey] || getPreferredChartView();

      // Tally Count is a raw occurrence count, not a pass/fail rate, so a
      // pie breakdown doesn't mean anything for it - show a note instead.
      if (format === 'tally' && activeView === 'pie') {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '14px system-ui';
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'center';
        ctx.fillText("Pie summary isn't available for Tally Count objectives.", canvas.width / 2, 100);
        return;
      }

      if (format === 'accuracy') {
        const evaluableData = data.filter(d => d.status === 'Logged' && d.denominator);

        if (evaluableData.length === 0) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.font = '14px system-ui';
          ctx.fillStyle = '#64748b';
          ctx.textAlign = 'center';
          ctx.fillText('No evaluable entries logged for this objective yet.', canvas.width / 2, 100);
          return;
        }

        if (activeView === 'pie') {
          const correctSum = evaluableData.reduce((sum, d) => sum + (Number(d.numerator) || 0), 0);
          const incorrectSum = evaluableData.reduce((sum, d) => sum + Math.max((Number(d.denominator) || 0) - (Number(d.numerator) || 0), 0), 0);

          activeChartInstances[objKey] = new Chart(canvas, {
            type: 'pie',
            data: {
              labels: ['Correct', 'Incorrect'],
              datasets: [{
                data: [correctSum, incorrectSum],
                backgroundColor: ['#16a34a', '#dc2626']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom' },
                datalabels: {
                  color: '#fff',
                  font: { weight: 'bold' },
                  formatter: (value, ctx) => {
                    const sum = ctx.dataset.data.reduce((a, b) => a + b, 0);
                    const percentage = Math.round((value / sum) * 100) + '%';
                    return value > 0 ? percentage : '';
                  }
                }
              }
            },
            plugins: [ChartDataLabels]
          });
        } else {
          const labels = evaluableData.map(d => new Date(d.created_at).toLocaleDateString());
          const values = evaluableData.map(d => Math.round(((Number(d.numerator) || 0) / Number(d.denominator)) * 100));

          activeChartInstances[objKey] = new Chart(canvas, {
            type: 'line',
            data: {
              labels,
              datasets: [{
                label: 'Accuracy %',
                data: values,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                fill: true,
                tension: 0.2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { min: 0, max: 100, ticks: { callback: value => value + '%' } }
              },
              plugins: { legend: { display: false }, datalabels: { display: false } }
            }
          });
        }
        return;
      }

      if (format === 'tally') {
        const evaluableData = data.filter(d => d.status === 'Logged');

        if (evaluableData.length === 0) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.font = '14px system-ui';
          ctx.fillStyle = '#64748b';
          ctx.textAlign = 'center';
          ctx.fillText('No evaluable entries logged for this objective yet.', canvas.width / 2, 100);
          return;
        }

        const labels = evaluableData.map(d => new Date(d.created_at).toLocaleDateString());
        const values = evaluableData.map(d => Number(d.numerator) || 0);

        activeChartInstances[objKey] = new Chart(canvas, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: 'Tally Count',
              data: values,
              borderColor: '#2563eb',
              backgroundColor: 'rgba(37, 99, 235, 0.1)',
              fill: true,
              tension: 0.2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { min: 0, ticks: { stepSize: 1 } } },
            plugins: { legend: { display: false }, datalabels: { display: false } }
          }
        });
        return;
      }

      const evaluableData = data.filter(d => d.status === 'Yes' || d.status === 'No');

      if (evaluableData.length === 0) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '14px system-ui';
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'center';
        ctx.fillText('No evaluable entries (Yes/No) logged for this objective yet.', canvas.width / 2, 100);
        return;
      }

      if (activeView === 'pie') {
        const yesCount = evaluableData.filter(d => d.status === 'Yes').length;
        const noCount = evaluableData.filter(d => d.status === 'No').length;

        activeChartInstances[objKey] = new Chart(canvas, {
          type: 'pie',
          data: {
            labels: ['Yes', 'No'],
            datasets: [{
              data: [yesCount, noCount],
              backgroundColor: ['#16a34a', '#dc2626']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom' },
              datalabels: {
                color: '#fff',
                font: { weight: 'bold' },
                formatter: (value, ctx) => {
                  const sum = ctx.dataset.data.reduce((a, b) => a + b, 0);
                  const percentage = Math.round((value / sum) * 100) + '%';
                  return value > 0 ? percentage : '';
                }
              }
            }
          },
          plugins: [ChartDataLabels]
        });
      } else {
        const labels = evaluableData.map(d => new Date(d.created_at).toLocaleDateString());
        const values = evaluableData.map(d => d.status === 'Yes' ? 100 : 0);

        activeChartInstances[objKey] = new Chart(canvas, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: 'Success (% Yes)',
              data: values,
              borderColor: '#2563eb',
              backgroundColor: 'rgba(37, 99, 235, 0.1)',
              fill: true,
              tension: 0.2,
              pointRadius: 5,
              pointBackgroundColor: values.map(v => v === 100 ? '#16a34a' : '#dc2626')
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                min: 0,
                max: 100,
                ticks: {
                  callback: value => value + '%'
                }
              }
            },
            plugins: {
              legend: { display: false },
              datalabels: { display: false }
            }
          }
        });
      }
    }

    async function renderDataHistoryTable(studentId, objKey) {
      const containerEl = document.getElementById(`data-history-table-${objKey}`);
      if (!containerEl) return;

      const student = allStudents.find(s => s.id === studentId);
      const format = getObjectiveFormat(student, objKey);

      const { data, error } = await supabaseClient
        .from('progress_data')
        .select('*')
        .eq('student_id', studentId)
        .eq('objective_key', objKey)
        .eq('iep_version', student?.iep_version || 1)
        .order('created_at', { ascending: false });

      if (error) {
        containerEl.innerHTML = '<p style="color:red;">Error loading logs.</p>';
        return;
      }

      // Absent / No Opportunity are already surfaced as counters above the
      // chart - no need to clutter this table with rows that aren't actual
      // data points.
      const displayData = (data || []).filter(d => d.status !== 'Absent' && d.status !== 'No Opportunity');

      if (displayData.length === 0) {
        containerEl.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">No entries logged yet.</p>';
        return;
      }

      containerEl.innerHTML = `
        <div style="max-height:180px; overflow-y:auto;">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Status</th>
                <th>Value</th>
                <th>Prompts</th>
                <th>Notes</th>
                <th>Logged By</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${displayData.map(d => {
                let valueCell = 'N/A';
                if (format === 'accuracy' && d.status === 'Logged') {
                  valueCell = `${escapeHtml(d.numerator)} / ${escapeHtml(d.denominator)}`;
                } else if (format === 'tally' && d.status === 'Logged') {
                  valueCell = escapeHtml(d.numerator);
                }
                return `
                <tr>
                  <td>${new Date(d.created_at).toLocaleDateString()}</td>
                  <td><strong>${escapeHtml(d.status)}</strong></td>
                  <td>${valueCell}</td>
                  <td>${escapeHtml(d.prompts || '0')}</td>
                  <td>${escapeHtml(d.notes || '')}</td>
                  <td>${escapeHtml(d.logged_by || '')}</td>
                  <td>
                    <button class="danger sm" onclick="deleteProgressEntry('${d.id}', '${studentId}', '${objKey}')">Delete</button>
                  </td>
                </tr>
              `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    async function deleteProgressEntry(entryId, studentId, objKey) {
      if (!confirm('Delete this logged entry?')) return;

      const { error } = await supabaseClient.from('progress_data').delete().eq('id', entryId);
      if (error) {
        alert('Error deleting entry: ' + error.message);
      } else {
        renderObjectiveChart(studentId, objKey);
        renderDataHistoryTable(studentId, objKey);
      }
    }

    async function saveStudentChanges(e, studentId) {
      e.preventDefault();

      const payload = {
        first_name: document.getElementById('edit_first_name')?.value.trim(),
        last_name: document.getElementById('edit_last_name')?.value.trim(),
        case_manager_email: formatUserEmailInput(document.getElementById('edit_cm_email')?.value)
      };

      [1, 2, 3, 4, 5].forEach(p => {
        const tVal = document.getElementById(`edit_teacher_p${p}`)?.value;
        const pVal = document.getElementById(`edit_paras_p${p}`)?.value;

        if (tVal !== undefined) payload[`teacher_p${p}`] = formatUserEmailInput(tVal);
        if (pVal !== undefined) payload[`paras_p${p}`] = parseParaUsernames(pVal);
      });

      const objKeys = ['obj_1_1', 'obj_1_2', 'obj_2_1', 'obj_2_2', 'obj_3_1', 'obj_3_2', 'goal_4_domain', 'obj_4_1', 'obj_4_2'];
      objKeys.forEach(key => {
        const el = document.getElementById(`edit_${key}`);
        if (el && el.tagName === 'INPUT') {
          payload[key] = el.value;
        }
      });

      // Tracking format selects stay on the page (and editable) regardless of
      // whether the goal text itself is locked, so these always get saved.
      ['obj_1_1', 'obj_1_2', 'obj_2_1', 'obj_2_2', 'obj_3_1', 'obj_3_2', 'obj_4_1', 'obj_4_2'].forEach(key => {
        const formatEl = document.getElementById(`edit_${key}_format`);
        if (formatEl) payload[`${key}_format`] = formatEl.value;
      });

      const { error } = await supabaseClient.from('students').update(payload).eq('id', studentId);

      if (error) {
        alert('Error saving changes: ' + error.message);
      } else {
        closeModal();
        if (activeNav === 'caseload') loadCaseload();
        else if (activeNav === 'admin') loadAdminView();
        else if (activeNav === 'students') loadStudentsView();
        else switchView(activePeriod);
      }
    }

    // Basic info, case manager, and all 8 goals/objectives (with tracking
    // format) are all configured on this one screen and saved together  -
    // no second "now go fill in the goals" modal afterward.
    // Creating a student is just creating a blank record and immediately
    // editing it - same modal as any existing student, opened straight to
    // Student Setup so the name/case manager get filled in right away.
    async function createNewStudent(fromAdmin = false) {
      const payload = {
        first_name: '',
        last_name: '',
        case_manager_email: fromAdmin ? null : currentUserEmail,
        iep_version: 1
      };

      const { data, error } = await supabaseClient.from('students').insert([payload]).select().single();

      if (error) {
        alert('Error creating student: ' + error.message);
        return;
      }

      allStudents.push(data);
      openStudentModal(data.id, 'setup');
    }

    async function deleteStudent(studentId) {
      if (!confirm('Permanently delete this student and all their data? This cannot be undone.')) {
        return;
      }

      await supabaseClient.from('progress_data').delete().eq('student_id', studentId);
      await supabaseClient.from('iep_goal_archive').delete().eq('student_id', studentId);
      const { error } = await supabaseClient.from('students').delete().eq('id', studentId);

      if (error) {
        alert('Error deleting student: ' + error.message);
      } else {
        closeModal();
        if (activeNav === 'caseload') loadCaseload();
        else if (activeNav === 'admin') loadAdminView();
        else if (activeNav === 'students') loadStudentsView();
        else switchView(activePeriod);
      }
    }

    function closeModal() {
      Object.values(activeChartInstances).forEach(instance => instance && instance.destroy());
      activeChartInstances = {};
      document.getElementById('modal-root').innerHTML = '';
    }

    window.onload = function() {
      initApp();
    };
  </script>
</body>
</html>
