<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Reporter - IEP Data Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #16a34a;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 20px; }
    button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #64748b; }
    button.outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.danger { background: #dc2626; }
    .nav-btn.active { background: #1e40af; font-weight: bold; }
    
    /* MODAL STYLES */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: #fff; padding: 24px; border-radius: 12px; max-width: 650px; width: 90%; max-height: 85vh; overflow-y: auto;
    }
    .tab-buttons { display: flex; gap: 8px; border-bottom: 2px solid var(--border); margin-bottom: 16px; padding-bottom: 8px; }
    .tab-btn { background: transparent; color: var(--text); border: none; padding: 8px 12px; }
    .tab-btn.active { border-bottom: 3px solid var(--primary); font-weight: bold; color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    input, textarea, select { width: 100%; padding: 8px; margin: 6px 0 16px 0; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
    textarea { min-height: 80px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 style="margin:0;">IEP Progress Reporter</h1>
        <small id="user-display">Loading session...</small>
      </div>
      <div>
        <button class="outline" onclick="loadCaseload(currentUserEmail)">My Caseload</button>
        <button class="danger" onclick="supabaseClient.auth.signOut().then(() => location.reload())">Sign Out</button>
      </div>
    </header>

    <!-- PERIOD NAVIGATION -->
    <div class="grid">
      <button class="nav-btn" onclick="switchView('p1', 1)">1st Hour</button>
      <button class="nav-btn" onclick="switchView('p2', 2)">2nd Hour</button>
      <button class="nav-btn" onclick="switchView('p3', 3)">3rd Hour</button>
      <button class="nav-btn" onclick="switchView('p4', 4)">4th Hour</button>
      <button class="nav-btn" onclick="switchView('p5', 5)">5th Hour</button>
      <button class="nav-btn secondary" onclick="loadCaseload(currentUserEmail)">My Caseload</button>
    </div>

    <!-- MAIN VIEW CONTAINER -->
    <div id="main-view"></div>
  </div>

  <!-- MODAL CONTAINER -->
  <div id="modal-root"></div>

  <script>
    const SUPABASE_URL = 'https://jhrirprisfpksnzvcjls.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_KmbjXRJ8dWiQVfqQlrI8lQ_vSXKIBA4';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUserEmail = '';
    let currentUserId = '';
    let allStudents = [];
    let currentPeriod = null;

    async function initApp() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        document.getElementById('main-view').innerHTML = '<p>Please log in to access the reporter.</p>';
        return;
      }
      currentUserEmail = session.user.email;
      currentUserId = session.user.id;
      document.getElementById('user-display').innerText = `${currentUserEmail} (Staff)`;
      
      fetchAllStudents();
      loadCaseload(currentUserEmail);
    }

    async function fetchAllStudents() {
      const { data, error } = await supabaseClient.from('students').select('*');
      if (!error && data) {
        allStudents = data;
      }
    }

    // --- CASELOAD VIEW & NEW STUDENT CREATION ---
    async function loadCaseload(email) {
      currentPeriod = null;
      await fetchAllStudents();
      const myCaseload = allStudents.filter(s => s.case_manager_email === email);
      
      let html = `
        <div class="flex-between" style="margin-bottom: 16px;">
          <h2>My Caseload (${email})</h2>
          <button onclick="openCreateStudentModal()">+ Add New Student to System</button>
        </div>
      `;

      if (myCaseload.length === 0) {
        html += '<p>No students found for this view.</p>';
      } else {
        myCaseload.forEach(student => {
          html += `
            <div class="card flex-between" style="cursor:pointer;" onclick="openStudentModal('${student.id}')">
              <h3>${student.first_name} ${student.last_name}</h3>
              <button class="outline" onclick="event.stopPropagation(); openStudentModal('${student.id}')">Manage IEP / Schedule</button>
            </div>
          `;
        });
      }
      document.getElementById('main-view').innerHTML = html;
    }

    // --- PERIOD ROSTER VIEWS ---
    async function switchView(periodKey, periodNum) {
      currentPeriod = periodNum;
      await fetchAllStudents();
      const colName = `teacher_p${periodNum}`;
      const periodRoster = allStudents.filter(s => s[colName] === currentUserEmail);

      let html = `
        <div class="flex-between" style="margin-bottom: 16px;">
          <h2>${periodNum}th Hour Roster</h2>
          <button onclick="openAddToPeriodModal(${periodNum})">+ Add Existing Student to Roster</button>
        </div>
      `;

      if (periodRoster.length === 0) {
        html += '<p>No students in this class period roster.</p>';
      } else {
        periodRoster.forEach(student => {
          html += `
            <div class="card flex-between">
              <div onclick="openStudentModal('${student.id}')" style="cursor:pointer;">
                <h3 style="margin:0;">${student.first_name} ${student.last_name}</h3>
              </div>
              <button class="danger" onclick="removeStudentFromPeriod('${student.id}', ${periodNum})">Remove from Class</button>
            </div>
          `;
        });
      }
      document.getElementById('main-view').innerHTML = html;
    }

    // --- STUDENT PROFILE MODAL WITH TABS ---
    function openStudentModal(studentId) {
      const student = allStudents.find(s => s.id === studentId);
      if (!student) return;

      const modalHTML = `
        <div class="modal-backdrop">
          <div class="modal-content">
            <h2>${student.first_name} ${student.last_name}</h2>
            <div class="tab-buttons">
              <button class="tab-btn active" onclick="switchTab('data-tab', this)">Data & Graphs</button>
              <button class="tab-btn" onclick="switchTab('goals-tab', this)">Goals & Objectives</button>
              <button class="tab-btn" onclick="switchTab('teachers-tab', this)">Assign Teachers</button>
            </div>

            <!-- TAB 1: DATA & GRAPHS -->
            <div id="data-tab" class="tab-content active">
              <h3>Progress Tracker & Visuals</h3>
              <p>Graphs and entry logs for IEP objective tracking.</p>
            </div>

            <!-- TAB 2: GOALS & OBJECTIVES -->
            <div id="goals-tab" class="tab-content">
              <h3>Goals & Objectives</h3>
              <label>Goals Description:</label>
              <textarea id="modal-goals">${student.goals || ''}</textarea>
              <label>Objectives:</label>
              <textarea id="modal-objectives">${student.objectives || ''}</textarea>
              <button onclick="saveGoals('${student.id}')">Save IEP Data</button>
            </div>

            <!-- TAB 3: ASSIGN TEACHERS -->
            <div id="teachers-tab" class="tab-content">
              <h3>Class Period Teacher Assignments</h3>
              <label>1st Hour Teacher Email:</label>
              <input type="email" id="tp1" value="${student.teacher_p1 || ''}">
              <label>2nd Hour Teacher Email:</label>
              <input type="email" id="tp2" value="${student.teacher_p2 || ''}">
              <label>3rd Hour Teacher Email:</label>
              <input type="email" id="tp3" value="${student.teacher_p3 || ''}">
              <label>4th Hour Teacher Email:</label>
              <input type="email" id="tp4" value="${student.teacher_p4 || ''}">
              <label>5th Hour Teacher Email:</label>
              <input type="email" id="tp5" value="${student.teacher_p5 || ''}">
              <button onclick="saveTeachers('${student.id}')">Save Period Assignments</button>
            </div>

            <div style="margin-top: 20px; text-align: right;">
              <button class="secondary" onclick="closeModal()">Close</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-root').innerHTML = modalHTML;
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    // --- DATA SAVE HANDLERS ---
    async function saveGoals(studentId) {
      const goals = document.getElementById('modal-goals').value;
      const objectives = document.getElementById('modal-objectives').value;

      const { error } = await supabaseClient
        .from('students')
        .update({ goals, objectives })
        .eq('id', studentId);

      if (!error) {
        alert('Goals updated successfully!');
        closeModal();
      }
    }

    async function saveTeachers(studentId) {
      const updates = {
        teacher_p1: document.getElementById('tp1').value,
        teacher_p2: document.getElementById('tp2').value,
        teacher_p3: document.getElementById('tp3').value,
        teacher_p4: document.getElementById('tp4').value,
        teacher_p5: document.getElementById('tp5').value,
      };

      const { error } = await supabaseClient.from('students').update(updates).eq('id', studentId);
      if (!error) {
        alert('Teachers assigned successfully!');
        closeModal();
        if (currentPeriod) switchView(`p${currentPeriod}`, currentPeriod);
      }
    }

    // --- ROSTER MANAGEMENT MODALS ---
    function openAddToPeriodModal(periodNum) {
      const unassigned = allStudents.filter(s => s[`teacher_p${periodNum}`] !== currentUserEmail);
      let options = unassigned.map(s => `<option value="${s.id}">${s.first_name} ${s.last_name}</option>`).join('');

      const modalHTML = `
        <div class="modal-backdrop">
          <div class="modal-content">
            <h3>Add Existing Student to ${periodNum}th Hour</h3>
            <select id="select-student-to-add">${options}</select>
            <button onclick="addStudentToPeriod('${periodNum}')">Add to Class</button>
            <button class="secondary" onclick="closeModal()">Cancel</button>
          </div>
        </div>
      `;
      document.getElementById('modal-root').innerHTML = modalHTML;
    }

    async function addStudentToPeriod(periodNum) {
      const studentId = document.getElementById('select-student-to-add').value;
      const updateData = {};
      updateData[`teacher_p${periodNum}`] = currentUserEmail;

      const { error } = await supabaseClient.from('students').update(updateData).eq('id', studentId);
      if (!error) {
        closeModal();
        switchView(`p${periodNum}`, periodNum);
      }
    }

    async function removeStudentFromPeriod(studentId, periodNum) {
      const updateData = {};
      updateData[`teacher_p${periodNum}`] = null;

      const { error } = await supabaseClient.from('students').update(updateData).eq('id', studentId);
      if (!error) {
        switchView(`p${periodNum}`, periodNum);
      }
    }

    function openCreateStudentModal() {
      const modalHTML = `
        <div class="modal-backdrop">
          <div class="modal-content">
            <h3>Add New Student to System</h3>
            <label>First Name:</label>
            <input type="text" id="new-fn">
            <label>Last Name:</label>
            <input type="text" id="new-ln">
            <button onclick="createStudent()">Create Student</button>
            <button class="secondary" onclick="closeModal()">Cancel</button>
          </div>
        </div>
      `;
      document.getElementById('modal-root').innerHTML = modalHTML;
    }

    async function createStudent() {
      const fn = document.getElementById('new-fn').value;
      const ln = document.getElementById('new-ln').value;

      const { error } = await supabaseClient.from('students').insert([{
        first_name: fn,
        last_name: ln,
        case_manager_email: currentUserEmail,
        case_manager_id: currentUserId
      }]);

      if (!error) {
        closeModal();
        loadCaseload(currentUserEmail);
      }
    }

    initApp();
  </script>
</body>
</html>
